# Builds sandy-3 for each platform and attaches the binaries to a GitHub
# release. It never makes the release: publish one by hand (or with `gh
# release create`) and this picks it up from there, so the notes and the tag
# stay yours.
name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: write # to upload assets onto the release

env:
  CARGO_TERM_COLOR: always
  # `.cargo/config.toml` routes rustc through sccache. The sccache-action step
  # below installs it on the runner, and this tells it to keep the cache in
  # the GitHub Actions cache rather than on the runner's disk, so it survives
  # from one release to the next.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 rather than the newest image so the binary links
          # against an older glibc and runs on more distributions.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      # Reads rust-toolchain.toml, so this gets the same nightly and the same
      # components as a local checkout.
      - name: Install toolchain
        run: rustup toolchain install

      # Puts sccache on the path, so the wrapper in `.cargo/config.toml` works
      # here the same as it does locally.
      - uses: mozilla-actions/sccache-action@v0.0.11

      # Caches the registry and `target`; sccache covers the compiled crates
      # themselves, so between the two a rebuild of an unchanged dependency
      # never happens on a runner either.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # QuickJS is built with `cc` and FastNoise2 with CMake; every
      # runner image ships a C/C++ compiler and cmake already.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: sccache stats
        run: sccache --show-stats

      - name: Package
        shell: bash
        run: |
          name="sandy-3-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/sandy-3.exe" "$name/"
            7z a "$name.zip" "$name"
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/sandy-3" "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "$ASSET" \
            --repo "${{ github.repository }}" --clobber

  # The Android app: the same crate built as a shared library for arm64 with
  # cargo-ndk, then wrapped in an APK by the Gradle project under `android/`.
  # iOS builds too (see the README) but needs a signing identity to go
  # anywhere, so it is not released here.
  android:
    name: aarch64-linux-android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android

      # QuickJS's Rust bindings are generated at build time for Android,
      # which needs libclang, and the NDK's CMake toolchain wants Ninja.
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y libclang-dev ninja-build

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: ndk;30.0.16248370 platforms;android-36 build-tools;36.1.0

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.0"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # CMake, building FastNoise2, finds the NDK through ANDROID_NDK_ROOT.
      - name: Build the library
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/30.0.16248370"
          cargo ndk -t arm64-v8a -P 28 --link-libcxx-shared \
            -o android/app/src/main/jniLibs \
            build --release --locked -p sandy-3-android

      - name: sccache stats
        run: sccache --show-stats

      # Signed with the repository's key when the secrets are set, and with
      # Gradle's debug key otherwise, so there is always an APK that
      # installs; a debug key changes from one build to the next, so a phone
      # with an earlier build on it has to uninstall it first.
      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          fi
          gradle assembleRelease --no-daemon

      - name: Package
        run: cp android/app/build/outputs/apk/release/app-release.apk sandy-3-aarch64-linux-android.apk

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" sandy-3-aarch64-linux-android.apk \
            --repo "${{ github.repository }}" --clobber
