[package]
name = "sandy-3"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "A falling-sand simulation whose physics run on the GPU, written with unipute and wgpu."

[[bin]]
name = "sandy-3"
path = "src/main.rs"

[dependencies]

# Reinterpreting our plain `u32`/`i32` arrays as the bytes `Queue::write_buffer`
# wants, without hand-rolling the casts.
bytemuck = "1.25"

# The control panel. `egui-wgpu` draws it in a pass over the finished frame and
# `egui-winit` feeds it the window's input.
#
# `egui-wgpu` runs with default features off only to leave out `wgpu/webgl`,
# which this has no use for: the simulation is compute shaders, which WebGL does
# not have. The macOS resize fix is worth keeping, so it is asked for by name.
egui = "0.36"
egui-wgpu = { version = "0.36", default-features = false, features = [
    "macos-window-resize-jitter-fix",
] }
egui-winit = "0.36"

env_logger = "0.11"

# Noise for the world generator. A safe wrapper over FastNoise2, the C++
# successor to FastNoise Lite, whose Rust port has not been touched since 2024.
# The C++ library is bundled and built with cmake, so cmake and a C++17
# compiler have to be about.
fastnoise2 = "0.4"

# A small, fast, non-cryptographic random number generator, for rolling a
# world seed at startup and on the Random button. The seed only has to differ
# from the last one; it is shown on the panel so a good one can be kept.
fastrand = "2.5"

log = "0.4"

# Plugins. A plugin is a Lua script that registers materials and tools through
# a small `sandy` table; see `src/plugins.rs`. `vendored` builds the Lua 5.5
# interpreter from source with `cc`, so nothing has to be installed first.
mlua = { version = "0.12", features = ["lua55", "vendored"] }

pollster = "1.0" # block_on for wgpu's async device request

# The simulation itself. Kernels are written as Rust functions and turned into
# WGSL while this crate compiles, so a broken rule is a build error here rather
# than a shader compile failure at startup. Not on crates.io yet, hence the git
# dependency, pinned to a commit so builds stay reproducible.
unipute = { git = "https://github.com/playforge-coding/unipute", rev = "8d8f570807c8c8e10e85fba4c0072d381dab4544" }

# Window, surface and the render passes. The compute kernels unipute generates
# are handed to wgpu as ordinary shader modules. The version is the one
# `egui-wgpu` above asks for.
wgpu = "30.0"
winit = "0.30.13"

# Debug builds go through cranelift, which produces unoptimised code a good deal
# faster than LLVM does. The first block covers this crate, the second every
# dependency, since `package."*"` does not reach the crate being built.
[profile.dev]
codegen-backend = "cranelift"

[profile.dev.package."*"]
codegen-backend = "cranelift"

# The exceptions. egui rasterises glyphs with `vello_cpu`, which reaches for
# NEON through `fearless_simd`, and cranelift has no aarch64 lowering for some
# of those intrinsics. A cranelift build of these aborts the moment the first
# glyph is drawn, so they stay on LLVM. The two vello crates are named because
# `fearless_simd` is generic and monomorphises into its callers; putting only
# `fearless_simd` on LLVM leaves the trapping code in the vello crates.
[profile.dev.package.fearless_simd]
codegen-backend = "llvm"

[profile.dev.package.vello_common]
codegen-backend = "llvm"

[profile.dev.package.vello_cpu]
codegen-backend = "llvm"

[profile.release]
opt-level = 3
lto = true
